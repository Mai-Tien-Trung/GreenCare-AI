spring.application.name=GreenCareAI

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

openapi.api.key=${OPENAI_API_KEY}
openapi.api.model=gpt-4o
openapi.api.url=https://api.openai.com/v1/chat/completions
payos.client.id=${PAYOS_CLIENT_ID}
payos.api.key=${PAYOS_API_KEY}
payos.checksum.key=${PAYOS_CHECKSUM_KEY}
payos.api.baseurl=https://api-merchant.payos.vn
payos.base.url=https://greencare-ai.onrender.com
payos.webhook.url=${payos.base.url}/api/payos/webhook
payos.return.url=${payos.base.url}/api/payos/close-webview
payos.cancel.url=${payos.base.url}/api/payos/close-webview